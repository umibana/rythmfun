[package]
name = "rythmfunlauncher-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Gamepad", "GamepadButton", "Storage", "Element",
    "HtmlInputElement", "File", "FileList", "KeyboardEvent",
    "Document", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
] }

[workspace]
members = ["src-tauri"]

# Release size/perf settings (profiles only apply at the workspace root).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
